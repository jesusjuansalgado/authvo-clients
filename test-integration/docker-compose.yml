# AuthVO local integration harness
# -----------------------------------------------------------------------------
# Brings up, behind Traefik's TLS port, on the IAM origin (iam.local.io):
#   - INDIGO IAM  (+ MariaDB, Redis, trustanchors)   -> the authorization server
#   - augmenter   (tiny Python reverse proxy)         -> adds the RFC 9728
#       `protected_resources` member to the IAM's two metadata documents (an
#       INTERIM emulation; delete it once INDIGO publishes the member itself)
# and, on its own origin (src.local.io):
#   - resource    (the protected REST interface)      -> the demo closer; it
#       serves its OWN RFC 9728 Protected Resource Metadata
# and, on a third origin (evil.local.io), for the negative test:
#   - evil        (a second fake-rs)                  -> names the real IAM in its
#       PRM but is not in the IAM's protected_resources, so clients must refuse it
#
# Run ./setup.sh first: it generates the *.local.io certs and the Traefik
# dynamic config, reminds you about /etc/hosts, then `docker compose up`.
#
# NOTE on INDIGO IAM: image tags, env var names and the bootstrap mechanism
# move between releases. The `iam` service below mirrors the upstream
# indigo-iam/iam compose shape; pin a known-good tag and adjust env to your
# version. The harness around it (augmenter, proxy, resource, demo) is stable.

services:
  proxy:
    image: traefik:v3.1
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro   # written by setup.sh
      - ./certs:/certs:ro
    # Start Traefik AFTER the services it routes to are running. Its Docker provider
    # lists the running containers once at start-up and then follows start events; a
    # backend that only starts in between can be missed, leaving that router
    # unregistered (every path for it then answers Traefik's bare "404 page not
    # found" until the proxy is restarted). Ordering the start so the backends are
    # already running removes that window. (A mitigation: the race is rare and could
    # not be reproduced on demand; provision.sh also diagnoses it.)
    depends_on:
      - iam
      - augmenter
      - resource
      - evil
    networks:
      default:
        aliases:
          - iam.local.io
          - src.local.io

  # --- IAM origin: authorization server -------------------------------------
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: pwd
      MYSQL_USER: iam
      MYSQL_PASSWORD: pwd
      MYSQL_DATABASE: iam
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  trustanchors:
    image: indigoiam/trustanchors:latest
    command: /bin/true
    volumes:
      - trustanchors:/etc/grid-security/certificates

  iam:
    image: indigoiam/iam-login-service:v1.15.0   # the release planned for production; pin to one you trust
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./iam/iam.env
    volumes:
      - trustanchors:/etc/grid-security/certificates:ro
      # JWT signing key set (generated by setup; kid must match IAM_JWK_DEFAULT_KEY_ID).
      - ./iam/keys/keystore.jwks:/keystore.jwks:ro
    labels:
      - "traefik.enable=true"
      # IAM gets the whole iam.local.io host EXCEPT its two metadata documents,
      # which the higher-priority `augmenter` router below intercepts.
      - "traefik.http.routers.iam.rule=Host(`iam.local.io`)"
      - "traefik.http.routers.iam.entrypoints=websecure"
      - "traefik.http.routers.iam.tls=true"
      - "traefik.http.routers.iam.priority=1"
      - "traefik.http.services.iam.loadbalancer.server.port=8080"

  # --- Metadata augmenter: the IAM's discovery documents + protected_resources
  # INTERIM emulation of RFC 9728 section 4 (see augmenter/app.py). It proxies the
  # IAM's live metadata and adds `protected_resources` from a mounted file.
  # REMOVE this service and its router once INDIGO IAM publishes the member.
  augmenter:
    build: ./augmenter
    environment:
      AUGMENTER_UPSTREAM: "http://iam:8080"       # the IAM, on the internal network
      AUGMENTER_UPSTREAM_HOST: "iam.local.io"     # so the IAM emits its public URLs
      AUGMENTER_CACHE_SECONDS: "60"
    volumes:
      # Mount the DIRECTORY (not the single file) so editors that replace the
      # file on save don't leave a stale bind mount; the app re-reads it per request.
      - ./augmenter/config:/config:ro
    labels:
      - "traefik.enable=true"
      # Higher priority than the IAM router so exactly these two paths win on
      # the shared iam.local.io origin; every other path still reaches the IAM.
      - "traefik.http.routers.augmenter.rule=Host(`iam.local.io`) && (Path(`/.well-known/oauth-authorization-server`) || Path(`/.well-known/openid-configuration`))"
      - "traefik.http.routers.augmenter.entrypoints=websecure"
      - "traefik.http.routers.augmenter.tls=true"
      - "traefik.http.routers.augmenter.priority=100"
      - "traefik.http.services.augmenter.loadbalancer.server.port=8080"

  # --- Resource origin: the protected REST interface ------------------------
  resource:
    build: ./fake-rs
    environment:
      # The SERVICE identifier: the one entry the IAM lists in `protected_resources`
      # for this service (augmenter/config/protected_resources.json). The service
      # owns everything at or below RS_SERVICE_PATH; the PRM for any such URL is
      # GENERATED PER REQUEST and names exactly the URL that was asked about.
      RS_RESOURCE_ID: "https://src.local.io/vo"
      RS_SERVICE_PATH: "/vo"
      # Identifiers a token's aud may name (at least one must cover the request).
      # Both entries of the IAM's list, so a domain-wide token is accepted too.
      RS_AUDIENCE_IDS: "https://src.local.io/vo https://src.local.io/datalink"
      RS_ISSUER: "https://iam.local.io/"
      RS_REQUIRED_SCOPE: "vo.read"
      RS_TEST_FAULTS: "1"                   # serve the /vo/faults/... discovery fixtures (negative tests)
      RS_CA_BUNDLE: "/certs/local-ca.pem"   # trust the harness origin for JWKS
      # PyJWKClient (pinned PyJWT 2.7.0) fetches the JWKS via urllib, which
      # ignores RS_CA_BUNDLE; point urllib's default TLS context at our CA too.
      SSL_CERT_FILE: "/certs/local-ca.pem"
      # Read the payload from the mounted directory below. The app re-opens this
      # file on every request, so edits to the art show up live.
      RS_PAYLOAD_FILE: "/payload/protected_resource.txt"
    volumes:
      - ./certs/local-ca.pem:/certs/local-ca.pem:ro
      # Mount the WHOLE fake-rs dir (not the single file) at /payload. A directory
      # bind-mount survives editors that replace the file on save (atomic write),
      # so changing protected_resource.txt is picked up with no restart/rebuild.
      - ./fake-rs:/payload:ro
    labels:
      - "traefik.enable=true"
      # Only this service's subtree, and the PRMs of its URLs, are sent here: the
      # shared-host case, where other services on src.local.io would get their own
      # router (and their own /.well-known/oauth-protected-resource/<their path>).
      - "traefik.http.routers.rs.rule=Host(`src.local.io`) && (PathPrefix(`/vo`) || PathPrefix(`/.well-known/oauth-protected-resource/vo`))"
      - "traefik.http.routers.rs.entrypoints=websecure"
      - "traefik.http.routers.rs.tls=true"
      - "traefik.http.services.rs.loadbalancer.server.port=8000"

  # --- The "evil" resource server: the negative test --------------------------
  # A second fake-rs on its OWN origin (evil.local.io). Its 401 points at its own
  # perfectly well-formed PRM, which names the REAL IAM as the authorization server
  # -- exactly the "evil service" attack -- but evil.local.io is NOT in the IAM's
  # protected_resources (augmenter/config/protected_resources.json), so every
  # client must abort at the resource check, before any login or device code.
  evil:
    build: ./fake-rs
    environment:
      RS_RESOURCE_ID: "https://evil.local.io"
      RS_ISSUER: "https://iam.local.io/"    # <- names the real IAM
      RS_REQUIRED_SCOPE: "vo.read"
      RS_CA_BUNDLE: "/certs/local-ca.pem"
      SSL_CERT_FILE: "/certs/local-ca.pem"
      # A payload that makes a leak obvious if a client ever got this far.
      RS_PAYLOAD_FILE: "/payload/evil_payload.txt"
    volumes:
      - ./certs/local-ca.pem:/certs/local-ca.pem:ro
      - ./fake-rs:/payload:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evil.rule=Host(`evil.local.io`)"
      - "traefik.http.routers.evil.entrypoints=websecure"
      - "traefik.http.routers.evil.tls=true"
      - "traefik.http.services.evil.loadbalancer.server.port=8000"

volumes:
  trustanchors:

networks:
  default:
