# Traefik static configuration.
# Terminates TLS for the harness origins and routes by Host / Path:
#   iam.local.io  -> the IAM, except its two /.well-known metadata documents,
#                    which go to the augmenter (higher router priority)
#   src.local.io  -> the protected resource server (which serves its own PRM)
entryPoints:
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Self-signed certs for *.local.io are generated by setup.sh into ./certs and
# referenced from the dynamic config (dynamic.yml, written by setup.sh).
log:
  level: INFO

api:
  dashboard: false
